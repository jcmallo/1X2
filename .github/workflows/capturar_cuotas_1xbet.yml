name: Capturar cuotas de Liga F (1xBet)

# Las cuotas de Liga F desde la API de linea de 1xBet.
#
# Ninguna API de las que pagamos cubre la liga femenina española, y el
# comparador que usábamos publicaba solo dos de los ocho partidos. 1xBet los
# tiene todos y los sirve como JSON, no como HTML: no depende de que no
# cambien el diseño de una página.
#
# El Pleno al 15 lo captura el otro workflow (sportytrader), que lee el
# marcador exacto de la casilla 15 sea de la competición que sea.
#
# Se ejecuta junto con la captura de LaLiga: las cuotas se mueven durante la
# semana y cada captura se guarda con su franja temporal, para que al
# entrenar se use la que estaba disponible antes del partido y no la del
# cierre.

on:
  schedule:
    # Miércoles, jueves y viernes por la mañana.
    - cron: "10 9 * * 3,4,5"
    # Sábado cerca del cierre de la quiniela.
    - cron: "10 10 * * 6"
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja temporal de la captura"
        required: false
        default: "T-24"
        type: choice
        options: ["T-72", "T-24", "T-2", "CIERRE"]
      dry_run:
        description: "Simular sin escribir en la base de datos"
        required: false
        default: false
        type: boolean

jobs:
  capturar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # El comparador filtra por huella TLS, igual que SELAE: sin
          # curl_cffi la petición recibe un 403.
          pip install --upgrade "curl_cffi>=0.16"
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Probar puente IONOS
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python probar_api.py

      # Sin working-directory: el script importa el paquete `mercado`, así
      # que se ejecuta desde la raíz del repositorio con -m.
      - name: Capturar cuotas de Liga F
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          ARGS="--franja ${{ inputs.franja || 'T-24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m mercado.cuotas_1xbet $ARGS
