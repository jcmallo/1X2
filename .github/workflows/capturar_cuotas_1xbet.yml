name: Capturar cuotas de Liga F

# Las cuotas de Liga F desde la API de linea de 1xBet.
#
# Ninguna API de las que pagamos cubre la liga femenina española, y el
# comparador que usábamos publicaba solo dos de los ocho partidos. 1xBet los
# tiene todos y los sirve como JSON, no como HTML: no depende de que no
# cambien el diseño de una página.
#
# El Pleno al 15 lo captura el otro workflow (sportytrader), que lee el
# marcador exacto de la casilla 15 sea de la competición que sea.
#
# Ni 1xBet ni SportyTrader cubren los ocho partidos siempre: hay jornadas
# con casillas de Liga F que se quedan sin "% Apuestas" en el panel porque
# ninguna de las dos tenía ese partido en el momento de la captura. El
# tercer paso (Eduardo Losilla) solo rellena esos huecos concretos, nunca
# sustituye lo que ya trajeron los dos anteriores.
#
# Se ejecuta junto con la captura de LaLiga: las cuotas se mueven durante la
# semana y cada captura se guarda con su franja temporal, para que al
# entrenar se use la que estaba disponible antes del partido y no la del
# cierre.

on:
  schedule:
    # Miércoles, jueves y viernes por la mañana.
    - cron: "10 9 * * 3,4,5"
    # Sábado cerca del cierre de la quiniela.
    - cron: "10 10 * * 6"
  workflow_dispatch:
    inputs:
      franja:
        description: "Franja temporal de la captura"
        required: false
        default: "T-24"
        type: choice
        options: ["T-72", "T-24", "T-2", "CIERRE"]
      dry_run:
        description: "Simular sin escribir en la base de datos"
        required: false
        default: false
        type: boolean

jobs:
  capturar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # El comparador filtra por huella TLS, igual que SELAE: sin
          # curl_cffi la petición recibe un 403.
          pip install --upgrade "curl_cffi>=0.16"
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Probar puente IONOS
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python probar_api.py

      # Sin working-directory: el script importa el paquete `mercado`, así
      # que se ejecuta desde la raíz del repositorio con -m.
      # Las dos fuentes son independientes y ninguna puede tumbar a la otra.
      # 1xBet devuelve 403 a ratos —su antibot va por rachas— y eso hacía
      # que SportyTrader ni llegara a ejecutarse, que es justo cuando más
      # falta hace.
      - name: 1xBet
        continue-on-error: true
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          ARGS="--franja ${{ inputs.franja || 'T-24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m mercado.cuotas_1xbet $ARGS

      # SportyTrader: la mediana de una docena de casas.
      #
      # Estaba escrito y sin ejecutar: no tenía workflow, así que nunca
      # había corrido ni una vez. De ahí que la Liga F llevara semanas con
      # una sola fuente.
      #
      # Y hace falta porque 1xBet no cotiza toda la competición. En la
      # jornada 6 publicó tres partidos y solo uno estaba en el boleto:
      # las casillas 11, 12 y 13 se quedaron sin columna de mercado, que es
      # justo lo que el optimizador necesita para calcular el valor.
      #
      # `continue-on-error` porque SportyTrader es una web que se raspa: si
      # cambia el HTML, lo que ya trajo 1xBet no se pierde.
      - name: SportyTrader
        continue-on-error: true
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          ARGS="--franja ${{ inputs.franja || 'T-24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m mercado.cuotas_ligaf $ARGS

      # Eduardo Losilla: solo rellena lo que 1xBet y SportyTrader dejaron sin
      # capturar. Por eso va el último, no antes: `solo_sin_cuotas` de
      # contexto_cuotas.php tiene que ver ya lo que trajeron los dos pasos
      # anteriores para saber qué es un hueco de verdad.
      #
      # `continue-on-error` por la misma razón que SportyTrader: es una web
      # que se raspa (aquí, una API no documentada de un competidor), y si
      # cambia no debe tumbar lo que ya se guardó.
      - name: Eduardo Losilla (relleno de huecos)
        continue-on-error: true
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          ARGS="--franja ${{ inputs.franja || 'T-24' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m mercado.cuotas_losilla $ARGS
