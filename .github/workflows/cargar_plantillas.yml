name: Cargar plantillas 2026-27

on:
  workflow_dispatch:

concurrency:
  group: plantillas-2026-27
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plantillas:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar plantillas oficiales
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python plantillas_2026_27.py
