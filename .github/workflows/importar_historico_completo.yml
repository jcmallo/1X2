name: Importar histórico completo

# Trae de una sola vez todas las jornadas celebradas desde 2016-17 hasta hoy,
# unas 700. Es el mismo importador que el workflow por temporadas, pero sin
# obligar a lanzarlo diez veces a mano.
#
# Tarda entre 25 y 40 minutos: cada jornada son dos peticiones a SELAE (el
# sorteo y los porcentajes apostados) más una escritura en IONOS, con una
# pausa corta entre medias para no acabar bloqueado.
#
# Es idempotente: reimportar una jornada que ya existe la actualiza en lugar
# de duplicarla. Así que si falla a mitad, basta con volver a lanzarlo; y si
# se corrige un campo que antes no se guardaba —como pasó con el signo del
# Pleno— se rellena reimportando, sin perder nada de lo demás.

on:
  workflow_dispatch:
    inputs:
      desde_temporada:
        description: "Año de inicio de la primera temporada (2016 = temporada 2016-17)"
        required: true
        default: "2016"
        type: string
      dry_run:
        description: "Simular sin escribir en la base de datos"
        required: false
        default: false
        type: boolean

jobs:
  importar:
    runs-on: ubuntu-latest
    # Por defecto GitHub corta a las 6 horas; con 3 sobra de largo incluso
    # yendo hasta 2008, y evita que un cuelgue consuma la cuota entera.
    timeout-minutes: 180

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # SELAE identifica al cliente por su huella TLS, no por el
          # User-Agent: sin curl_cffi la petición recibe un 403.
          pip install --upgrade "curl_cffi>=0.16"
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Probar puente IONOS
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python probar_api.py

      # Sin working-directory: el script importa el paquete `historico`, así
      # que se ejecuta desde la raíz del repositorio con -m.
      - name: Importar desde la temporada indicada hasta hoy
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          # La temporada de fútbol arranca en agosto.
          DESDE="${{ inputs.desde_temporada }}-08-01"
          ARGS="--desde $DESDE"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi

          echo "Importando desde $DESDE hasta hoy."
          echo "Son unas 70 jornadas por temporada; ten paciencia con el log."
          python -m historico.importar_selae $ARGS
