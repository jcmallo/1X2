name: Pronosticar con modelo propio

# Entrena el Elo con el histórico de la base y pronostica la jornada.
#
# Va antes de "Proponer boleto" para que el optimizador pueda contar con el
# pronóstico propio en las casillas donde no hay mercado, que son las de
# Liga F: ninguna casa las cotiza y hasta ahora iban a ciegas.
#
# El script mide su propio rendimiento por competición antes de guardar nada
# y solo publica donde supera al baseline. Hoy eso son LaLiga y Liga F;
# Segunda División queda fuera porque el modelo empeora la predicción.

on:
  schedule:
    # Viernes 09:15 UTC, entre la captura de LAE y la propuesta.
    - cron: "15 9 * * 5"
    # Sábado 10:15 UTC, mismo hueco.
    - cron: "15 10 * * 6"
  workflow_dispatch:
    inputs:
      temporada:
        description: "Temporada (vacío = la más reciente)"
        required: false
        type: string
      jornada:
        description: "Número de jornada (vacío = la más reciente)"
        required: false
        type: string
      tipo:
        description: "Franja temporal de la captura"
        required: false
        default: "T-24"
        type: choice
        options: ["T-72", "T-24", "T-2", "CIERRE"]
      dry_run:
        description: "Simular sin escribir en la base de datos"
        required: false
        default: false
        type: boolean

jobs:
  pronosticar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # El modelo usa regresión logística sobre las características de
          # modelado/caracteristicas.py. Se instalan aquí para no tocar el
          # requirements.txt del repositorio.
          pip install "scikit-learn>=1.3" "numpy>=1.24"

      - name: Probar puente IONOS
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python probar_api.py

      # Sin working-directory: el script importa el paquete `modelado`, así
      # que se ejecuta desde la raíz del repositorio con -m.
      - name: Entrenar y pronosticar
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          ARGS="--tipo ${{ inputs.tipo || 'T-24' }}"
          if [ -n "${{ inputs.temporada }}" ]; then ARGS="$ARGS --temporada ${{ inputs.temporada }}"; fi
          if [ -n "${{ inputs.jornada }}" ]; then ARGS="$ARGS --jornada ${{ inputs.jornada }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m modelado.pronosticar $ARGS
