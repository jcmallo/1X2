name: Histórico 2024-25

on:
  workflow_dispatch:

concurrency:
  group: historico-2024-25
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  historico:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cargar temporada 2024-25
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python historico_temporada.py --temporada 2024-25
