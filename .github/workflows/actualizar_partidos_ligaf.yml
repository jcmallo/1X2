name: Actualizar partidos Liga F

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de ejecución"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - reconciliar
          - completo

  # Automático dos veces al día.
  # GitHub interpreta cron en UTC.
  schedule:
    - cron: "17 5,17 * * *"

    # Una vez por semana revisa además unas pocas jornadas recientes.
    - cron: "47 4 * * 1"

concurrency:
  group: partidos-ligaf
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  partidos-ligaf:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Determinar modo
        id: modo
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "modo=${{ inputs.modo }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "47 4 * * 1" ]]; then
            echo "modo=reconciliar" >> "$GITHUB_OUTPUT"
          else
            echo "modo=auto" >> "$GITHUB_OUTPUT"
          fi

      - name: Actualizar Liga F
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          LIGAF_MODO: ${{ steps.modo.outputs.modo }}
          LIGAF_RETRO_HORAS: "72"
          LIGAF_FUTURO_DIAS: "21"
          LIGAF_ADELANTE_JORNADAS: "3"
          LIGAF_ULTIMAS_JORNADAS: "4"
        run: python ligaf_partidos.py
