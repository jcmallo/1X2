name: Diagnóstico fuentes históricas v2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: python -m pip install requests

      - name: Probar mosaico histórico 2022-23
        working-directory: ingestion
        run: python diagnostico_fuentes_historicas.py
