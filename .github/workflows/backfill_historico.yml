name: Backfill histórico 2022-26

on:
  workflow_dispatch:
    inputs:
      temporada:
        description: "Temporada a cargar"
        required: true
        default: "todas"
        type: choice
        options:
          - todas
          - "2022-23"
          - "2023-24"
          - "2024-25"
          - "2025-26"
      competicion:
        description: "Competición"
        required: true
        default: "todas"
        type: choice
        options:
          - todas
          - primera
          - segunda
          - ligaf
      dry_run:
        description: "Solo validar fuentes/parsers; no escribir en IONOS"
        required: true
        default: false
        type: boolean

concurrency:
  group: backfill-historico
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar backfill secuencial
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
          INPUT_TEMPORADA: ${{ inputs.temporada }}
          INPUT_COMPETICION: ${{ inputs.competicion }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$INPUT_TEMPORADA" == "todas" ]]; then
            TEMPORADAS=("2022-23" "2023-24" "2024-25" "2025-26")
          else
            TEMPORADAS=("$INPUT_TEMPORADA")
          fi

          EXTRA=()
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            EXTRA+=("--dry-run")
          fi

          for TEMP in "${TEMPORADAS[@]}"; do
            echo "============================================================"
            echo "TEMPORADA $TEMP"
            echo "============================================================"

            if [[ "$INPUT_COMPETICION" == "todas" || "$INPUT_COMPETICION" == "primera" ]]; then
              python laliga_historico.py --temporada "$TEMP" --division primera "${EXTRA[@]}"
            fi

            if [[ "$INPUT_COMPETICION" == "todas" || "$INPUT_COMPETICION" == "segunda" ]]; then
              python laliga_historico.py --temporada "$TEMP" --division segunda "${EXTRA[@]}"
            fi

            if [[ "$INPUT_COMPETICION" == "todas" || "$INPUT_COMPETICION" == "ligaf" ]]; then
              python soccerdonna_ligaf_historico.py --temporada "$TEMP" "${EXTRA[@]}"
            fi
          done
