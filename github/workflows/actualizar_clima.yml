name: Actualizar clima

# Se puede lanzar de dos formas:
#   1. Automáticamente, todos los días a las 06:00 UTC.
#   2. A mano, desde la pestaña "Actions" de GitHub (botón "Run workflow"),
#      que es el equivalente a un futuro botón "Actualizar clima" en la web.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ingesta-clima:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar ingesta de clima
        working-directory: ingestion
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: python clima_open_meteo.py
