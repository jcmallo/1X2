name: Importar jornadas pasadas de SELAE

# Recupera jornadas ya celebradas desde el buscador oficial de sorteos.
#
# Los porcentajes apostados se leen en directo, así que lo que no se capturó
# a tiempo se pierde por esa vía. Pero SELAE mantiene un buscador de sorteos
# celebrados que devuelve, por jornada, los 15 partidos con nombres y
# marcadores, la combinación ganadora y el escrutinio con premios reales.
#
# Sirve para dos cosas:
#   - rellenar las jornadas que faltan de la temporada en curso
#   - reimportar el histórico con premios oficiales en lugar de estimados
#
# No está programado: se lanza a mano cuando hace falta. Reimportar es
# idempotente, así que repetirlo actualiza en vez de duplicar.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Qué importar"
        required: true
        default: "temporada actual"
        type: choice
        options:
          - "temporada actual"
          - "una temporada"
          - "rango de fechas"
      temporada:
        description: "Solo para 'una temporada': el año de inicio, p.ej. 2016 para la 2016-17"
        required: false
        type: string
      desde:
        description: "Solo para 'rango de fechas': AAAA-MM-DD"
        required: false
        type: string
      hasta:
        description: "Solo para 'rango de fechas': AAAA-MM-DD (vacío = hoy)"
        required: false
        type: string
      dry_run:
        description: "Simular sin escribir en la base de datos"
        required: false
        default: true
        type: boolean

jobs:
  importar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7

      - name: Instalar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          # SELAE identifica al cliente por la huella TLS, no por el
          # User-Agent: sin curl_cffi la petición recibe un 403.
          pip install --upgrade "curl_cffi>=0.16"
          python -c "import curl_cffi; print('curl_cffi', curl_cffi.__version__)"

      - name: Probar puente IONOS
        working-directory: ingestion
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: python probar_api.py

      # Sin working-directory: el script importa el paquete `historico`, así
      # que se ejecuta desde la raíz del repositorio con -m.
      - name: Importar
        env:
          INGEST_API_URL: ${{ secrets.INGEST_API_URL }}
          INGEST_API_TOKEN: ${{ secrets.INGEST_API_TOKEN }}
        run: |
          case "${{ inputs.modo }}" in
            "rango de fechas")
              ARGS="--desde ${{ inputs.desde }}"
              if [ -n "${{ inputs.hasta }}" ]; then ARGS="$ARGS --hasta ${{ inputs.hasta }}"; fi
              ;;
            "una temporada")
              # La temporada de fútbol va de agosto a julio del año siguiente.
              A="${{ inputs.temporada }}"
              ARGS="--desde ${A}-08-01 --hasta $((A+1))-07-31"
              ;;
            *)
              ARGS="--temporada-actual"
              ;;
          esac
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m historico.importar_selae $ARGS
